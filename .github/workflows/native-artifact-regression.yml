# Read-only native build, content admission, manifest and provenance regressions.
# Go payloads and MSI format fixtures are produced locally without release services.
name: Native artifact integration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-artifact-regression.yml
      - scripts/tests/test_native_artifact_build.sh
      - scripts/tests/test_act_runner.sh
      - scripts/tests/test_act_orchestration.sh
      - scripts/tests/test_build_state.sh
      - scripts/tests/e2e_prune.sh
      - scripts/tests/test_git_build_context.sh
      - scripts/tests/test_act_build_cmd_tokens.sh
      - scripts/tests/test_act_runner_native.sh
      - scripts/tests/test_native_source_sync.sh
      - scripts/tests/test_config.sh
      - scripts/tests/test_disk_free_floor.sh
      - scripts/tests/test_host_health.sh
      - scripts/tests/test_host_config_admission.sh
      - scripts/tests/test_artifact_formats.sh
      - scripts/tests/test_ordinary_collection_inventory.sh
      - scripts/tests/test_generated_installer_transactions.sh
      - scripts/tests/test_generated_installer_integrity.sh
      - scripts/tests/test_generated_workspace_installer.sh
      - scripts/tests/test_install_source.sh
      - scripts/tests/test_install_source_windows.sh
      - scripts/tests/test_install_source_family.sh
      - scripts/tests/test_toolchain_detect.sh
      - scripts/tests/test_upgrade_verify.sh
      - scripts/tests/test_generated_installer_source.sh
      - scripts/tests/test_generated_installer_workspace_bootstrap.sh
      - dsr
      - src/act_runner.sh
      - src/artifact_naming.sh
      - src/artifact_formats.sh
      - src/build_state.sh
      - src/config.sh
      - src/git_ops.sh
      - src/host_health.sh
      - src/install_gen.sh
      - src/install_gen_windows.ps1
      - src/install_source.sh
      - src/install_source_windows.ps1
      - src/toolchain_detect.sh
      - src/upgrade_verify.sh
      - src/packaging.sh
      - src/platforms.sh
      - src/slsa.sh
      - src/source_snapshot_windows.ps1
      - schemas/manifest.json
      - schemas/prune-details.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-artifact-integration-main
  cancel-in-progress: false
jobs:
  native-artifacts:
    if: github.repository == 'Dicklesworthstone/doodlestein_self_releaser' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: seven-target-release
          - os: macos-15
            targets: all-platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain the source under test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collector-evidence"
          git archive --format=tar HEAD > "$RUNNER_TEMP/collector-evidence/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/collector-evidence/head.txt"
          test -z "$(git status --porcelain)"
      - name: Install compiler, YAML, signature and archive dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq xz-utils golang-go minisign zip unzip msitools wixl rsync python3
          else
            for tool in jq xz go minisign rsync; do
              command -v "$tool" >/dev/null || brew install "$tool"
            done
            if ! command -v timeout >/dev/null && ! command -v gtimeout >/dev/null; then brew install coreutils; fi
            if (( BASH_VERSINFO[0] < 4 )); then brew install bash; fi
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Validate installed-Go recovery and private source toolchains
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/toolchain_detect.sh
          bash -n src/install_source.sh
          bash -n scripts/tests/test_toolchain_detect.sh
          bash -n scripts/tests/test_generated_installer_source.sh
          timeout 120 bash scripts/tests/test_toolchain_detect.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/toolchain-bootstrap.log"
          timeout 120 bash scripts/tests/test_generated_installer_source.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/generated-source-bootstrap.log"
          timeout 120 bash scripts/tests/test_generated_installer_workspace_bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/workspace-bootstrap.log"
          test -z "$(git status --porcelain)"
      - name: Validate large Git inventories and source context transport
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          bash -n dsr
          bash -n src/git_ops.sh
          bash -n src/act_runner.sh
          bash -n src/build_state.sh
          bash -n scripts/tests/test_git_build_context.sh
          bash scripts/tests/test_git_build_context.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/git-build-context.log"
          test -z "$(git status --porcelain)"
      - name: Install pinned Bun for genuine source-family compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun-v1.4.4-linux-x64-baseline.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --user-agent 'doodlestein_self_releaser-agent (+https://github.com/Dicklesworthstone/doodlestein_self_releaser)' \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64-baseline.zip
          printf '%s  %s\n' e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76 "$archive" | sha256sum --check --strict
          unzip -j "$archive" bun-linux-x64-baseline/bun -d "$RUNNER_TEMP/dsr-test-bin"
          test "$("$RUNNER_TEMP/dsr-test-bin/bun" --version)" = 1.4.4
      - name: Validate concurrent workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_act_runner.sh
          bash scripts/tests/test_act_runner.sh --workflow-isolation-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/workflow-isolation.log"
          test -z "$(git status --porcelain)"
      - name: Preserve native evidence across retries and concurrent attempts
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_act_runner_native.sh
          bash scripts/tests/test_act_runner_native.sh --attempt-isolation-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/native-attempt-isolation.log"
          test -z "$(git status --porcelain)"
      - name: Validate complete native workspace archives
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test_act_runner_native.sh --workspace-archives-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/native-workspace-archives.log"
          test -z "$(git status --porcelain)"
      - name: Validate Go compiler selectors and ARMv7 command expansion
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_act_build_cmd_tokens.sh
          bash scripts/tests/test_act_build_cmd_tokens.sh --go-cross-build 2>&1 | tee "$RUNNER_TEMP/collector-evidence/go-command-tokens.log"
          test -z "$(git status --porcelain)"
      - name: Preserve build custody and timed process ownership
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/build_state.sh
          bash -n scripts/tests/test_build_state.sh
          bash scripts/tests/test_build_state.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/build-state.log"
          bash scripts/tests/test_act_orchestration.sh --coordinator-custody-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/coordinator-custody.log"
          bash scripts/tests/test_act_runner.sh --timeout-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/timeout-ownership.log"
          timeout 120 bash scripts/tests/test_act_runner_native.sh --windows-launcher-transfer-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-launcher-transfer.log"
          timeout 120 bash scripts/tests/test_act_runner_native.sh --artifact-transfer-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/artifact-transfer.log"
          test -z "$(git status --porcelain)"
      - name: Build strict Go releases from pinned sibling snapshots
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSR_TEST_DISK_ROOT: /var/tmp
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_native_source_sync.sh
          DSR_TEST_GOCACHE=$(go env GOCACHE)
          export DSR_TEST_GOCACHE
          timeout 120 bash scripts/tests/test_native_source_sync.sh --strict-go-siblings-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/strict-go-siblings.log"
          timeout 120 bash scripts/tests/test_native_source_sync.sh --strict-go-admission-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/strict-go-admission.log"
          timeout 120 bash scripts/tests/test_native_source_sync.sh --strict-go-matrix-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/strict-go-matrix.log"
          test -z "$(git status --porcelain)"
      - name: Bind strict Go compiler policy through builds, resume and publication
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSR_TEST_DISK_ROOT: /var/tmp
        run: |
          set -euo pipefail
          DSR_TEST_GOCACHE=$(go env GOCACHE)
          export DSR_TEST_GOCACHE
          timeout 120 bash scripts/tests/test_native_source_sync.sh --strict-go-context-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/strict-go-context.log"
          timeout 120 bash scripts/tests/test_native_source_sync.sh --strict-cgo-selectors-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/strict-cgo-selectors.log"
          test -z "$(git status --porcelain)"
      - name: Verify Bun and TypeScript sibling builds
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSR_TEST_DISK_ROOT: /var/tmp
        run: |
          set -euo pipefail
          timeout 120 bash scripts/tests/test_native_source_sync.sh --strict-bun-siblings-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/strict-bun-siblings.log"
          timeout 120 bash scripts/tests/test_native_source_sync.sh --bun-siblings-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/ordinary-bun-siblings.log"
          test -z "$(git status --porcelain)"
      - name: Verify Windows Go staging with genuine PowerShell and PE outputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null || ! pwsh -NoLogo -NoProfile -Command 'if ($PSVersionTable.PSVersion -lt [version]"7.4") { exit 1 }'; then
            archive="$RUNNER_TEMP/powershell-7.5.2-linux-x64.tar.gz"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --user-agent 'doodlestein_self_releaser-agent (+https://github.com/Dicklesworthstone/doodlestein_self_releaser)' \
              --output "$archive" \
              https://github.com/PowerShell/PowerShell/releases/download/v7.5.2/powershell-7.5.2-linux-x64.tar.gz
            printf '%s  %s\n' 8fa9584f6f95d29ca1466c4397ac39c371373d6581c12dfae9ebd53c06d77664 "$archive" | sha256sum --check --strict
            mkdir -p "$RUNNER_TEMP/dsr-powershell"
            tar -xzf "$archive" -C "$RUNNER_TEMP/dsr-powershell"
            chmod +x "$RUNNER_TEMP/dsr-powershell/pwsh"
            export PATH="$RUNNER_TEMP/dsr-powershell:$PATH"
            echo "$RUNNER_TEMP/dsr-powershell" >> "$GITHUB_PATH"
          fi
          DOTNET_PROCESSOR_COUNT=1 timeout 120 bash scripts/tests/test_native_source_sync.sh --windows-strict-go-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-go-staging.log"
          test -z "$(git status --porcelain)"
      - name: Verify Windows Bun and TypeScript private staging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_PROCESSOR_COUNT=1 timeout 120 bash scripts/tests/test_native_source_sync.sh --windows-strict-bun-only \
            2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-bun-staging.log"
          test -z "$(git status --porcelain)"
      - name: Validate stdin-isolated target dispatch and exact-run resume
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_act_orchestration.sh
          bash scripts/tests/test_act_orchestration.sh --stdin-isolation-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/stdin-isolation.log"
          bash scripts/tests/test_act_orchestration.sh --worker-lifecycle-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/worker-lifecycle.log"
          bash scripts/tests/test_act_orchestration.sh --dispatch-reservation-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/dispatch-reservation.log"
          bash scripts/tests/test_act_runner.sh --worker-admission-cancel-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/admission-cancellation.log"
          bash scripts/tests/test_act_orchestration.sh --dispatch-stdin-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/dispatch-stdin.log"
          bash scripts/tests/test_act_orchestration.sh --capacity-resume-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/capacity-resume.log"
          bash scripts/tests/test_act_orchestration.sh --output-queue-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/output-queue.log"
          bash scripts/tests/test_act_orchestration.sh --host-capacity-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/host-capacity.log"
          test -z "$(git status --porcelain)"
      - name: Recover refused and failed native targets on approved replacement hosts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test_act_orchestration.sh --recipe-binding-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/recipe-binding.log"
          bash scripts/tests/test_act_orchestration.sh --relocation-recovery-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/relocation-recovery.log"
          bash scripts/tests/test_act_orchestration.sh --relocation-matrix-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/relocation-matrix.log"
          bash scripts/tests/test_act_orchestration.sh --relocation-variant-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/relocation-variant.log"
          bash scripts/tests/test_act_orchestration.sh --relocation-preview-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/relocation-preview.log"
          test -z "$(git status --porcelain)"
      - name: Reclaim retired snapshots while retaining release custody
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/e2e_prune.sh
          bash scripts/tests/test_act_orchestration.sh --snapshot-owners-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/snapshot-ownership.log"
          bash scripts/tests/e2e_prune.sh --snapshot-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/snapshot-retirement.log"
          test -z "$(git status --porcelain)"
      - name: Validate native and workflow companion artifact admission
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/artifact_formats.sh
          bash -n scripts/tests/test_artifact_formats.sh
          bash -n scripts/tests/test_act_runner_native.sh
          bash -n scripts/tests/test_config.sh
          bash scripts/tests/test_config.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/companion-config.log"
          bash scripts/tests/test_artifact_formats.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/artifact-formats.log"
          bash scripts/tests/test_act_runner_native.sh --typed-companions-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/typed-companions.log"
          bash scripts/tests/test_act_runner.sh --typed-companions-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/workflow-companions.log"
          test -z "$(git status --porcelain)"
      - name: Validate ordinary primary and companion packaging ownership
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_ordinary_collection_inventory.sh
          bash scripts/tests/test_ordinary_collection_inventory.sh --companion-packaging-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/ordinary-companion-packaging.log"
          test -z "$(git status --porcelain)"
      - name: Validate actual native writable-path admission
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/host_health.sh
          bash -n scripts/tests/test_disk_free_floor.sh
          bash -n scripts/tests/test_host_health.sh
          bash scripts/tests/test_disk_free_floor.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/writable-storage.log"
          bash scripts/tests/test_host_health.sh --disk-capacity-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/concurrent-storage.log"
          bash scripts/tests/test_host_config_admission.sh --capacity-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/public-capacity-admission.log"
          bash scripts/tests/test_act_runner_native.sh --host-writable-path-tests 2>&1 | tee "$RUNNER_TEMP/collector-evidence/writable-path-boundaries.log"
          test -z "$(git status --porcelain)"
      - name: Validate generated installer executable targets
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/install_gen.sh
          bash -n scripts/tests/test_generated_installer_integrity.sh
          deadline=$(command -v timeout || command -v gtimeout)
          "$deadline" 120 bash scripts/tests/test_generated_installer_integrity.sh --executable-targets-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/installer-executable-targets.log"
          test -z "$(git status --porcelain)"
      - name: Validate concurrent generated installers
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/install_gen.sh
          bash -n scripts/tests/test_generated_installer_transactions.sh
          bash scripts/tests/test_generated_installer_transactions.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/installer-transactions.log"
          test -z "$(git status --porcelain)"
      - name: Validate genuine Go and Bun source executable families
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go version
          bun --version
          bash -n src/install_source.sh
          bash scripts/tests/test_install_source.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/source-engine.log"
          bash scripts/tests/test_install_source_family.sh --bun-contracts-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/bun-family-contracts.log"
          bash scripts/tests/test_install_source_family.sh --bun-workspaces-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/bun-workspaces.log"
          bash scripts/tests/test_generated_workspace_installer.sh --go-bun-source-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/go-bun-source-families.log"
          timeout 120 bash scripts/tests/test_upgrade_verify.sh --bun-source-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/bun-source-upgrade.log"
          test -z "$(git status --porcelain)"
      - name: Validate Windows source installation and release freshness
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
          POWERSHELL_TELEMETRY_OPTOUT: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          pwsh --version
          bun --version
          bash -n scripts/tests/test_install_source_windows.sh
          bash scripts/tests/test_install_source_windows.sh --bun-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-bun-source.log"
          bash scripts/tests/test_install_source_windows.sh --bun-workspaces-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-bun-workspaces.log"
          timeout 120 bash scripts/tests/test_install_source_windows.sh --freshness-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-source-freshness.log"
          timeout 120 bash scripts/tests/test_install_source_windows.sh --fallback-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/windows-source-fallback.log"
          test -z "$(git status --porcelain)"
      - name: Validate native compilation, manifests and signed provenance
        shell: bash
        env:
          TARGET_SET: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          bash -n dsr
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_native_artifact_build.sh
          options=()
          if [[ "$TARGET_SET" == seven-target-release ]]; then options+=(--seven-target-release); fi
          bash scripts/tests/test_native_artifact_build.sh "${options[@]}" 2>&1 | tee "$RUNNER_TEMP/collector-evidence/regression.log"
          test -z "$(git status --porcelain)"
      - name: Retain native diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for fixture in "${TMPDIR:-/tmp}"/dsr-native-artifacts.*; do
            [[ -d "$fixture" ]] || continue
            tar --exclude=go-cache --exclude=output --exclude=artifacts --exclude='*.key' -czf \
              "$RUNNER_TEMP/collector-evidence/$(basename "$fixture").tar.gz" -C "$fixture" .
          done
      - name: Retain source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-artifact-evidence-${{ matrix.os }}-${{ matrix.targets }}
          path: ${{ runner.temp }}/collector-evidence
          retention-days: 7
          if-no-files-found: error
