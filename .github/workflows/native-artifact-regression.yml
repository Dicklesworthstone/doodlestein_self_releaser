# Read-only native build, content admission, manifest and provenance regressions.
# Go payloads and MSI format fixtures are produced locally without release services.
name: Native artifact integration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-artifact-regression.yml
      - scripts/tests/test_native_artifact_build.sh
      - scripts/tests/test_act_runner.sh
      - scripts/tests/test_act_runner_native.sh
      - scripts/tests/test_artifact_formats.sh
      - dsr
      - src/act_runner.sh
      - src/artifact_naming.sh
      - src/artifact_formats.sh
      - src/build_state.sh
      - src/config.sh
      - src/git_ops.sh
      - src/packaging.sh
      - src/platforms.sh
      - src/slsa.sh
      - schemas/manifest.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-artifact-integration-main
  cancel-in-progress: false
jobs:
  native-artifacts:
    if: github.repository == 'Dicklesworthstone/doodlestein_self_releaser' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            targets: seven-target-release
          - os: macos-15
            targets: all-platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain the source under test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collector-evidence"
          git archive --format=tar HEAD > "$RUNNER_TEMP/collector-evidence/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/collector-evidence/head.txt"
          test -z "$(git status --porcelain)"
      - name: Install compiler, YAML, signature and archive dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq xz-utils golang-go minisign zip unzip msitools wixl
          else
            for tool in jq xz go minisign; do
              command -v "$tool" >/dev/null || brew install "$tool"
            done
            if (( BASH_VERSINFO[0] < 4 )); then brew install bash; fi
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Validate concurrent workflow evidence
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_act_runner.sh
          bash scripts/tests/test_act_runner.sh --workflow-isolation-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/workflow-isolation.log"
          test -z "$(git status --porcelain)"
      - name: Validate typed additional artifact admission
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/artifact_formats.sh
          bash -n scripts/tests/test_artifact_formats.sh
          bash -n scripts/tests/test_act_runner_native.sh
          bash scripts/tests/test_artifact_formats.sh 2>&1 | tee "$RUNNER_TEMP/collector-evidence/artifact-formats.log"
          bash scripts/tests/test_act_runner_native.sh --typed-companions-only 2>&1 | tee "$RUNNER_TEMP/collector-evidence/typed-companions.log"
          test -z "$(git status --porcelain)"
      - name: Validate native compilation, manifests and signed provenance
        shell: bash
        env:
          TARGET_SET: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          bash -n dsr
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_native_artifact_build.sh
          options=()
          if [[ "$TARGET_SET" == seven-target-release ]]; then options+=(--seven-target-release); fi
          bash scripts/tests/test_native_artifact_build.sh "${options[@]}" 2>&1 | tee "$RUNNER_TEMP/collector-evidence/regression.log"
          test -z "$(git status --porcelain)"
      - name: Retain native diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for fixture in "${TMPDIR:-/tmp}"/dsr-native-artifacts.*; do
            [[ -d "$fixture" ]] || continue
            tar --exclude=go-cache --exclude=output --exclude=artifacts --exclude='*.key' -czf \
              "$RUNNER_TEMP/collector-evidence/$(basename "$fixture").tar.gz" -C "$fixture" .
          done
      - name: Retain source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-artifact-evidence-${{ matrix.os }}-${{ matrix.targets }}
          path: ${{ runner.temp }}/collector-evidence
          retention-days: 7
          if-no-files-found: error
