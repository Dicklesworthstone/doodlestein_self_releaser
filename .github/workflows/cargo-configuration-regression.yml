name: Cargo configuration attestation regression
on:
  push:
    branches: [main]
    paths:
      - src/act_runner.sh
      - schemas/manifest.json
      - scripts/tests/test_cargo_configuration.py
      - scripts/tests/test_cargo_configuration_security.py
      - scripts/tests/test_cargo_invocation_security.py
      - scripts/tests/test_toolchain_identity.sh
      - tests/fixtures/cargo/**
      - .github/workflows/cargo-configuration-regression.yml
  workflow_dispatch:
concurrency:
  group: cargo-configuration-regression-main
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install receipt schema validator
        run: python3 -m pip install 'jsonschema==4.23.0'
      - name: Materialize reviewed Zig target fix against exact source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! grep -q '^def cargo_target_identity(' src/act_runner.sh; then
            test "$(git hash-object src/act_runner.sh)" = 3c0b9e0304a8144aa79b01d966875ad5db25228f
            test "$(git hash-object schemas/manifest.json)" = 8fd537b0b09c98530285f49a0cca8dbf952234cc
            test "$(git hash-object scripts/tests/test_cargo_invocation_security.py)" = a0b70256b2efbcb92a6ed00279cbbda2603ee2a2
            for blob in 6b20d10a34e2b2bf1bf199dc20f1a3c8dfbaf488 fa1a735558643da2dd8f16e6035a52a4d5100ab5; do
              patch_file="$RUNNER_TEMP/$blob.patch"
              gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode > "$patch_file"
              test "$(git hash-object "$patch_file")" = "$blob"
              git apply --check "$patch_file"
              git apply "$patch_file"
            done
          fi
          git diff --check
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_toolchain_identity.sh
          python3 -I scripts/tests/test_cargo_configuration.py
          python3 -I scripts/tests/test_cargo_configuration_security.py
          python3 -I scripts/tests/test_cargo_invocation_security.py
          python3 -I scripts/tests/test_toolchain_receipt_schema.py
      # Parser/schema evidence is separate from the real compiler gates below.
      # Retain the exact whole-file candidates; no branch or tag is moved here.
      - name: Retain parser-qualified source objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          expected_paths=$(printf '%s\n' schemas/manifest.json scripts/tests/test_cargo_invocation_security.py src/act_runner.sh)
          test -z "$changed" || test "$changed" = "$expected_paths"
          for path in src/act_runner.sh schemas/manifest.json scripts/tests/test_cargo_invocation_security.py; do
            expected=$(git hash-object "$path")
            observed=$(jq -Rs '{content: ., encoding: "utf-8"}' "$path" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$observed" = "$expected"
            printf 'CANDIDATE_BLOB %s %s\n' "$path" "$observed"
          done
          git hash-object src/act_runner.sh schemas/manifest.json scripts/tests/test_cargo_invocation_security.py scripts/tests/test_toolchain_identity.sh scripts/tests/test_cargo_configuration.py > "$RUNNER_TEMP/cargo-source-before-tests.txt"
      - name: Install genuine compiler and lint dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
          cargo -vV
      - name: Run genuine Cargo and complete identity regressions
        run: |
          set -euo pipefail
          shellcheck -S warning src/act_runner.sh scripts/tests/test_toolchain_identity.sh
          python3 -I scripts/tests/test_cargo_configuration.py --integration
          bash scripts/tests/test_toolchain_identity.sh
          git hash-object src/act_runner.sh schemas/manifest.json scripts/tests/test_cargo_invocation_security.py scripts/tests/test_toolchain_identity.sh scripts/tests/test_cargo_configuration.py > "$RUNNER_TEMP/cargo-source-after-tests.txt"
          cmp "$RUNNER_TEMP/cargo-source-before-tests.txt" "$RUNNER_TEMP/cargo-source-after-tests.txt"
          while read -r blob; do printf 'REAL_COMPILER_QUALIFIED_BLOB %s\n' "$blob"; done < "$RUNNER_TEMP/cargo-source-after-tests.txt"
