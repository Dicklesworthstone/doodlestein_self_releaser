name: Release regression tests

on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/github.sh
      - scripts/tests/test_github.sh
      - scripts/tests/test_release_resume.sh
      - .github/workflows/release-regression.yml

permissions:
  contents: write

concurrency:
  group: release-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply the exact reviewed patch and verify the complete executable
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          test "$(git hash-object dsr)" = d8c3f10d5cf985c79d64fbb9f33418dedce938cc
          test "$(git hash-object scripts/tests/test_release_resume.sh)" = a1dc5142d19567fc4b40bd3762422159e77a1ad6
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_BASE64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == '319d73405b665582d941518c4b3e5a0dd3cb070a290f2eb27f50b579a2331934'
          pathlib.Path('/tmp/dsr-release-resume.patch').write_bytes(patch)
          PY
          git apply --check /tmp/dsr-release-resume.patch
          git apply /tmp/dsr-release-resume.patch
          awk '/^cmd_release\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > /tmp/cmd_release.function.sh
          echo '4d2b87d10d433a666e60d158aa6c13f60df84ad9ecedaaec03d94d0b7a824479  /tmp/cmd_release.function.sh' | sha256sum --check
          bash -n dsr
          bash -n src/github.sh
          bash -n scripts/tests/test_release_resume.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_github.sh
          # Once the full-file patch has been applied and tested, retain only
          # ordinary read-only regression CI. No migration payload or write
          # permission remains in the final workflow.
          cat > .github/workflows/release-regression.yml <<'WORKFLOW'
          name: Release regression tests
          on:
            push:
              branches: [main]
              paths:
                - dsr
                - src/github.sh
                - scripts/tests/test_github.sh
                - scripts/tests/test_release_resume.sh
                - .github/workflows/release-regression.yml
          permissions:
            contents: read
          concurrency:
            group: release-regression-${{ github.ref }}
            cancel-in-progress: false
          jobs:
            release-regression:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
                - name: Check syntax and release recovery
                  shell: bash
                  run: |
                    set -euo pipefail
                    bash -n dsr
                    bash -n src/github.sh
                    bash -n scripts/tests/test_release_resume.sh
                    bash scripts/tests/test_release_resume.sh
                    bash scripts/tests/test_github.sh
          WORKFLOW
          git diff --check
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '.github/workflows/release-regression.yml\ndsr\n')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dsr .github/workflows/release-regression.yml
          git commit -m 'fix(release): reconcile resumed releases against remote asset bytes'
          # A concurrent main update must cause rejection, never a forced push.
          git push origin HEAD:main
