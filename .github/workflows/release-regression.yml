name: Release regression tests
on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/github.sh
      - src/cargo_cache.sh
      - src/cargo_sources.sh
      - src/packaging.sh
      - src/config.sh
      - src/host_health.sh
      - src/logging.sh
      - 'src/xwin*.sh'
      - 'scripts/xwin*.sh'
      - 'scripts/tests/test_xwin*.sh'
      - schemas/manifest.json
      - scripts/tests/test_json_schemas.sh
      - scripts/tests/test_cargo_cache.sh
      - scripts/tests/test_cargo_sources.sh
      - scripts/tests/test_cargo_sources_authentication.sh
      - scripts/tests/test_github.sh
      - scripts/tests/test_host_health.sh
      - scripts/tests/test_host_config_admission.sh
      - scripts/tests/test_release_resume.sh
      - scripts/tests/test_fallback_pipeline.sh
      - .github/workflows/release-regression.yml
permissions:
  contents: read
concurrency:
  group: release-regression-refs/heads/main
  cancel-in-progress: false
jobs:
  release-regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check syntax, fallback recovery, and release uploads
        shell: bash
        run: |
          set -euo pipefail
          bash -n dsr
          bash -n src/github.sh
          bash -n scripts/tests/test_release_resume.sh
          bash -n scripts/tests/test_fallback_pipeline.sh
          awk '/^cmd_fallback\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > "$RUNNER_TEMP/cmd_fallback.sh"
          shellcheck -s bash -S warning "$RUNNER_TEMP/cmd_fallback.sh"
          bash ./dsr --version
          bash ./dsr fallback --help
          bash scripts/tests/test_fallback_pipeline.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_github.sh
  private-cargo-cache:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install LLVM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm jq shellcheck python3-jsonschema
      - name: Check private cache and Windows build regressions
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -S warning src/cargo_cache.sh src/xwin_build.sh scripts/tests/test_cargo_cache.sh scripts/tests/test_xwin_build.sh
          shellcheck -S warning src/cargo_sources.sh src/xwin_source.sh scripts/tests/test_cargo_sources.sh scripts/tests/test_xwin_source.sh
          shellcheck -S warning scripts/tests/test_cargo_sources_authentication.sh
          bash -n src/cargo_cache.sh
          bash -n src/xwin_build.sh
          bash -n src/cargo_sources.sh
          bash -n src/xwin_source.sh
          bash -n scripts/tests/test_cargo_sources.sh
          bash -n scripts/tests/test_xwin_source.sh
          bash -n scripts/tests/test_cargo_sources_authentication.sh
          bash scripts/tests/test_cargo_cache.sh
          bash scripts/tests/test_cargo_sources.sh
          bash scripts/tests/test_cargo_sources_authentication.sh
          bash scripts/tests/test_xwin_source.sh
          bash scripts/tests/test_xwin_toolchain.sh
          bash scripts/tests/test_xwin_build.sh
          bash scripts/tests/test_xwin_release_build.sh
          XWIN_TEST_TARGET=x86_64-pc-windows-msvc bash scripts/tests/test_xwin_release_build.sh
          bash scripts/tests/test_json_schemas.sh
  host-admission:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install host-check test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck golang-go openssh-client
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Check host configuration and health admission
        shell: bash
        env:
          DSR_TEST_REQUIRE_YQ: '1'
        run: |
          set -euo pipefail
          yq --version
          bash -n src/host_health.sh
          bash -n scripts/tests/test_host_config_admission.sh
          shellcheck -S warning src/host_health.sh scripts/tests/test_host_config_admission.sh
          bash scripts/tests/test_host_config_admission.sh
          bash scripts/tests/test_host_health.sh
