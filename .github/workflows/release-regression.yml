name: Release regression tests
on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/github.sh
      - scripts/tests/test_github.sh
      - scripts/tests/test_release_resume.sh
      - scripts/tests/test_fallback_pipeline.sh
      - .github/workflows/release-regression.yml
permissions:
  contents: read
concurrency:
  group: release-regression-refs/heads/main
  cancel-in-progress: false
jobs:
  release-regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check syntax, fallback recovery, and release uploads
        shell: bash
        run: |
          set -euo pipefail
          bash -n dsr
          bash -n src/github.sh
          bash -n scripts/tests/test_release_resume.sh
          bash -n scripts/tests/test_fallback_pipeline.sh
          awk '/^cmd_fallback\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > "$RUNNER_TEMP/cmd_fallback.sh"
          shellcheck -s bash -S warning "$RUNNER_TEMP/cmd_fallback.sh"
          bash ./dsr --version
          bash ./dsr fallback --help
          bash scripts/tests/test_fallback_pipeline.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_github.sh
