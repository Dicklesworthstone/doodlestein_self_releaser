name: Release regression tests
on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/github.sh
      - scripts/tests/test_github.sh
      - scripts/tests/test_release_resume.sh
      - scripts/tests/test_fallback_pipeline.sh
      - .github/workflows/release-regression.yml
permissions:
  contents: write
concurrency:
  group: release-regression-refs/heads/main
  cancel-in-progress: true
jobs:
  release-regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply and validate the two source-bound implementation stages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object dsr)" = 29ebeeac4fb1df052c2ce669f8e2f98f2fd954c6
          awk '/^cmd_fallback\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > /tmp/fallback-original.sh
          echo 'e112ecc56b819805499f70bfbd68fdf6b9e07339d95f14e631f8d08b95f63964  /tmp/fallback-original.sh' | sha256sum --check
          for sha in bd3f2e67dc1a9cb545d3bc423ccfe178eb1dfdc4 ea086f431b4e20461366c171c253b64b278d429a 273971db86cbb459a1ded64de1277b97552d5dc8 40592f69ee6e12cbfec2e271d66760f643c8596c; do
            gh api "repos/Dicklesworthstone/doodlestein_self_releaser/git/blobs/$sha" > "/tmp/$sha.json"
          done
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          for sha in ['bd3f2e67dc1a9cb545d3bc423ccfe178eb1dfdc4', 'ea086f431b4e20461366c171c253b64b278d429a', '273971db86cbb459a1ded64de1277b97552d5dc8', '40592f69ee6e12cbfec2e271d66760f643c8596c']:
              data = base64.b64decode(json.loads(pathlib.Path('/tmp/' + sha + '.json').read_text())['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              with pathlib.Path('/tmp/' + sha + '.sh').open('xb') as stream:
                  stream.write(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Construct a normal full-file patch from the exact reviewed function,
          # retaining all surrounding bytes and the executable mode of dsr.
          apply_function() {
            local replacement="$1" start count
            test "$(grep -c '^cmd_fallback() {' dsr)" = 1
            start=$(grep -n '^cmd_fallback() {' dsr | cut -d: -f1)
            awk '/^cmd_fallback\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > /tmp/fallback-current.sh
            count=$(wc -l < /tmp/fallback-current.sh)
            {
              head -n "$((start - 1))" dsr
              cat "$replacement"
              tail -n "+$((start + count))" dsr
            } > /tmp/dsr-candidate
            diff -u --label a/dsr --label b/dsr dsr /tmp/dsr-candidate > /tmp/fallback.patch || test "$?" = 1
            git apply --check /tmp/fallback.patch
            git apply /tmp/fallback.patch
            cmp -s dsr /tmp/dsr-candidate
          }
          test ! -e scripts/tests/test_fallback_pipeline.sh
          apply_function /tmp/bd3f2e67dc1a9cb545d3bc423ccfe178eb1dfdc4.sh
          cp /tmp/ea086f431b4e20461366c171c253b64b278d429a.sh scripts/tests/test_fallback_pipeline.sh
          bash -n dsr
          bash scripts/tests/test_fallback_pipeline.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_github.sh
          git add -- dsr scripts/tests/test_fallback_pipeline.sh
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$(printf 'dsr\nscripts/tests/test_fallback_pipeline.sh\n')"
          git commit -m 'fix(fallback): block incomplete or unverified releases (bd-1dgf)'
          git push origin HEAD:main
          apply_function /tmp/273971db86cbb459a1ded64de1277b97552d5dc8.sh
          test "$(git hash-object scripts/tests/test_fallback_pipeline.sh)" = ea086f431b4e20461366c171c253b64b278d429a
          diff -u --label a/scripts/tests/test_fallback_pipeline.sh --label b/scripts/tests/test_fallback_pipeline.sh scripts/tests/test_fallback_pipeline.sh /tmp/40592f69ee6e12cbfec2e271d66760f643c8596c.sh > /tmp/fallback-tests.patch || test "$?" = 1
          git apply --check /tmp/fallback-tests.patch
          git apply /tmp/fallback-tests.patch
          bash -n dsr
          bash -n scripts/tests/test_fallback_pipeline.sh
          shellcheck -s bash -S warning /tmp/273971db86cbb459a1ded64de1277b97552d5dc8.sh
          bash scripts/tests/test_fallback_pipeline.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_github.sh
          git add -- dsr scripts/tests/test_fallback_pipeline.sh
          git diff --cached --check
          git commit -m 'feat(fallback): resume completed builds without rebuilding or resigning (bd-1dgf)'
          git push origin HEAD:main
