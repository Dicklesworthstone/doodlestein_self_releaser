name: Release regression tests
on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/github.sh
      - scripts/tests/test_github.sh
      - scripts/tests/test_release_resume.sh
      - scripts/tests/test_fallback_pipeline.sh
      - .github/workflows/release-regression.yml
permissions:
  contents: write
concurrency:
  group: release-regression-refs/heads/main
  cancel-in-progress: true
jobs:
  release-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply and test the source-bound fallback changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object dsr)" = 29ebeeac4fb1df052c2ce669f8e2f98f2fd954c6
          awk '/^cmd_fallback\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > /tmp/fallback-before.sh
          echo 'e112ecc56b819805499f70bfbd68fdf6b9e07339d95f14e631f8d08b95f63964  /tmp/fallback-before.sh' | sha256sum --check
          gh api repos/Dicklesworthstone/doodlestein_self_releaser/git/blobs/bd3f2e67dc1a9cb545d3bc423ccfe178eb1dfdc4 > /tmp/fallback-source.json
          gh api repos/Dicklesworthstone/doodlestein_self_releaser/git/blobs/ea086f431b4e20461366c171c253b64b278d429a > /tmp/fallback-tests.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          for source, output, expected in [
              ('/tmp/fallback-source.json', '/tmp/fallback-after.sh', 'bd3f2e67dc1a9cb545d3bc423ccfe178eb1dfdc4'),
              ('/tmp/fallback-tests.json', 'scripts/tests/test_fallback_pipeline.sh', 'ea086f431b4e20461366c171c253b64b278d429a'),
          ]:
              data = base64.b64decode(json.loads(pathlib.Path(source).read_text())['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == expected
              with pathlib.Path(output).open('xb') as stream:
                  stream.write(data)
          PY
          diff -u --label a/dsr --label b/dsr /tmp/fallback-before.sh /tmp/fallback-after.sh > /tmp/fallback.patch || test "$?" = 1
          git apply --check /tmp/fallback.patch
          git apply /tmp/fallback.patch
          bash -n dsr
          bash -n scripts/tests/test_fallback_pipeline.sh
          shellcheck -s bash -S warning /tmp/fallback-after.sh || true
          bash scripts/tests/test_fallback_pipeline.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_github.sh
          git add -- dsr scripts/tests/test_fallback_pipeline.sh
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$(printf 'dsr\nscripts/tests/test_fallback_pipeline.sh\n')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fallback): block incomplete or unverified releases (bd-1dgf)'
          git push origin HEAD:main
