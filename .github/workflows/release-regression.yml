name: Release regression tests
on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/github.sh
      - src/dispatch.sh
      - src/release_finalize_core.sh
      - src/release_finalize.sh
      - src/release_builds.sh
      - src/release_bundle.sh
      - src/release_packaging.sh
      - src/release_packaging_pipeline.sh
      - src/release_install.sh
      - src/install_gen_release.sh
      - src/platforms.sh
      - src/slsa.sh
      - src/slsa_remote.sh
      - src/cargo_cache.sh
      - src/cargo_sources.sh
      - src/packaging.sh
      - src/config.sh
      - src/host_health.sh
      - src/logging.sh
      - 'src/xwin*.sh'
      - 'scripts/xwin*.sh'
      - 'scripts/tests/test_xwin*.sh'
      - schemas/manifest.json
      - scripts/tests/test_json_schemas.sh
      - scripts/tests/test_cargo_cache.sh
      - scripts/tests/test_cargo_sources.sh
      - scripts/tests/test_cargo_sources_authentication.sh
      - scripts/tests/test_github.sh
      - scripts/tests/test_host_health.sh
      - scripts/tests/test_host_config_admission.sh
      - scripts/tests/test_release_resume.sh
      - scripts/tests/test_release_builds.sh
      - scripts/tests/test_release_builds_resume.sh
      - scripts/tests/test_release_builds_recovery.sh
      - scripts/tests/test_release_builds_admission.sh
      - scripts/tests/test_release_build_plan_variants.sh
      - scripts/tests/test_release_packaging.sh
      - scripts/tests/test_release_packaging_variants.sh
      - scripts/tests/test_release_install.sh
      - scripts/tests/test_release_install_fetch.sh
      - scripts/tests/test_release_install_variants.sh
      - scripts/tests/test_generated_release_installer.sh
      - scripts/tests/test_slsa_snapshot.sh
      - scripts/tests/test_release_source_only.sh
      - scripts/tests/test_release_source_only_exact_tag.sh
      - scripts/tests/test_dispatch_delivery.sh
      - scripts/tests/test_dispatch_outbox.sh
      - tests/unit/test_dispatch.bats
      - scripts/tests/test_fallback_pipeline.sh
      - .github/workflows/release-regression.yml
permissions:
  contents: read
concurrency:
  group: release-regression-refs/heads/main
  cancel-in-progress: false
jobs:
  build-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build recovery regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq python3 shellcheck util-linux coreutils procps
          mkdir -p "$RUNNER_TEMP/build-recovery-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/build-recovery-evidence/head.txt"
      - name: Validate scheduling, durable completion, recovery and cancellation
        shell: bash
        run: |
          set -euo pipefail
          files=(src/release_builds.sh scripts/tests/test_release_builds.sh
                 scripts/tests/test_release_builds_resume.sh scripts/tests/test_release_builds_recovery.sh
                 scripts/tests/test_release_builds_admission.sh)
          for source in "${files[@]}"; do
            bash -n "$source"
            shellcheck -S warning "$source"
          done
          for suite in release_builds release_builds_resume release_builds_recovery release_builds_admission; do
            bash "scripts/tests/test_${suite}.sh" 2>&1 | tee "$RUNNER_TEMP/build-recovery-evidence/${suite}.log"
          done
          test -z "$(git status --porcelain)"
      - name: Retain build recovery validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-recovery-evidence
          path: ${{ runner.temp }}/build-recovery-evidence
          retention-days: 7
          if-no-files-found: error
  build-packaging-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install local packaging regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq python3 shellcheck gcc tar zip unzip xz-utils util-linux
          mkdir -p "$RUNNER_TEMP/packaging-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/packaging-evidence/head.txt"
      - name: Validate exact build plans and shared-asset packaging
        shell: bash
        run: |
          set -euo pipefail
          files=(src/release_builds.sh src/release_packaging.sh src/release_packaging_pipeline.sh
                 scripts/tests/test_release_build_plan_variants.sh scripts/tests/test_release_packaging.sh
                 scripts/tests/test_release_packaging_variants.sh)
          for source in "${files[@]}"; do
            bash -n "$source"
            shellcheck -S warning "$source"
          done
          bash scripts/tests/test_release_build_plan_variants.sh 2>&1 | tee "$RUNNER_TEMP/packaging-evidence/build-plan-variants.log"
          bash scripts/tests/test_release_packaging.sh 2>&1 | tee "$RUNNER_TEMP/packaging-evidence/packaging.log"
          bash scripts/tests/test_release_packaging_variants.sh 2>&1 | tee "$RUNNER_TEMP/packaging-evidence/packaging-variants.log"
          test -z "$(git status --porcelain)"
      - name: Retain packaging validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-packaging-contract-evidence
          path: ${{ runner.temp }}/packaging-evidence
          retention-days: 7
          if-no-files-found: error
  authenticated-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DSR_TEST_MINISIGN_FIXTURE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install signed installation regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq python3 minisign shellcheck gcc tar zip unzip xz-utils util-linux
          mkdir -p "$RUNNER_TEMP/installation-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/installation-evidence/head.txt"
      - name: Validate complete authenticated installation generations
        shell: bash
        run: |
          set -euo pipefail
          files=(src/release_install.sh src/install_gen_release.sh
                 scripts/tests/test_release_install.sh scripts/tests/test_release_install_fetch.sh
                 scripts/tests/test_release_install_variants.sh scripts/tests/test_generated_release_installer.sh)
          for source in "${files[@]}"; do
            bash -n "$source"
            shellcheck -S warning "$source"
          done
          bash scripts/tests/test_release_install.sh 2>&1 | tee "$RUNNER_TEMP/installation-evidence/install.log"
          bash scripts/tests/test_release_install_variants.sh 2>&1 | tee "$RUNNER_TEMP/installation-evidence/signed-variants-and-data.log"
          bash scripts/tests/test_release_install_fetch.sh 2>&1 | tee "$RUNNER_TEMP/installation-evidence/fetch.log"
          bash scripts/tests/test_generated_release_installer.sh 2>&1 | tee "$RUNNER_TEMP/installation-evidence/generated-installer.log"
          test -z "$(git status --porcelain)"
      - name: Retain installation validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authenticated-installation-evidence
          path: ${{ runner.temp }}/installation-evidence
          retention-days: 7
          if-no-files-found: error
  release-regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dispatch regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq shellcheck curl util-linux golang-go
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Check syntax, fallback recovery, and release uploads
        shell: bash
        run: |
          set -euo pipefail
          bash -n dsr
          bash -n src/github.sh
          bash -n src/dispatch.sh
          bash -n scripts/tests/test_release_resume.sh
          bash -n scripts/tests/test_fallback_pipeline.sh
          awk '/^cmd_fallback\(\) \{/{copy=1} copy{print} copy && /^\}/{exit}' dsr > "$RUNNER_TEMP/cmd_fallback.sh"
          shellcheck -s bash -S warning "$RUNNER_TEMP/cmd_fallback.sh"
          bash ./dsr --version
          bash ./dsr fallback --help
          bash scripts/tests/test_fallback_pipeline.sh
          bash scripts/tests/test_release_resume.sh
          bash scripts/tests/test_release_source_only.sh
          bash scripts/tests/test_release_source_only_exact_tag.sh
          bash scripts/tests/test_dispatch_delivery.sh
          bash scripts/tests/test_dispatch_outbox.sh
          bats tests/unit/test_dispatch.bats
          bash scripts/tests/test_github.sh
  private-cargo-cache:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install LLVM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm jq shellcheck python3-jsonschema
      - name: Check private cache and Windows build regressions
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -S warning src/cargo_cache.sh src/xwin_build.sh scripts/tests/test_cargo_cache.sh scripts/tests/test_xwin_build.sh
          shellcheck -S warning src/cargo_sources.sh src/xwin_source.sh scripts/tests/test_cargo_sources.sh scripts/tests/test_xwin_source.sh
          shellcheck -S warning scripts/tests/test_cargo_sources_authentication.sh
          bash -n src/cargo_cache.sh
          bash -n src/xwin_build.sh
          bash -n src/cargo_sources.sh
          bash -n src/xwin_source.sh
          bash -n scripts/tests/test_cargo_sources.sh
          bash -n scripts/tests/test_xwin_source.sh
          bash -n scripts/tests/test_cargo_sources_authentication.sh
          bash scripts/tests/test_cargo_cache.sh
          bash scripts/tests/test_cargo_sources.sh
          bash scripts/tests/test_cargo_sources_authentication.sh
          bash scripts/tests/test_xwin_source.sh
          bash scripts/tests/test_xwin_toolchain.sh
          bash scripts/tests/test_xwin_build.sh
          bash scripts/tests/test_xwin_release_build.sh
          XWIN_TEST_TARGET=x86_64-pc-windows-msvc bash scripts/tests/test_xwin_release_build.sh
          bash scripts/tests/test_json_schemas.sh
  host-admission:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install host-check test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck golang-go openssh-client
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Check host configuration and health admission
        shell: bash
        env:
          DSR_TEST_REQUIRE_YQ: '1'
        run: |
          set -euo pipefail
          yq --version
          bash -n src/host_health.sh
          bash -n scripts/tests/test_host_config_admission.sh
          shellcheck -S warning src/host_health.sh scripts/tests/test_host_config_admission.sh
          bash scripts/tests/test_host_config_admission.sh
          bash scripts/tests/test_host_health.sh
