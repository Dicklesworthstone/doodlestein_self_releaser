      - name: Install native archive regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq clang lld xz-utils zip unzip
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Validate full runner and actual YAML, Git and archive paths
        shell: bash
        run: |
          set -euo pipefail
          yq --version
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_native_single_archives.sh
          bash scripts/tests/test_native_single_archives.sh
      - name: Commit verified implementation directly to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Remove this workflow's write authority in the implementation commit.
          # Do not retain a generic code-writing workflow or a patch replay job.
          cat > .github/workflows/native-archive-regression.yml <<'DSR_READ_ONLY_WORKFLOW'
          name: Native archive regression tests
          on:
            push:
              branches: [main]
              paths:
                - src/act_runner.sh
                - src/artifact_naming.sh
                - src/config.sh
                - scripts/tests/test_native_single_archives.sh
                - .github/workflows/native-archive-regression.yml
            workflow_dispatch:
          permissions:
            contents: read
          concurrency:
            group: native-archive-regression-main
            cancel-in-progress: false
          jobs:
            native-archives:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
                  with:
                    persist-credentials: false
                - name: Install native archive regression dependencies
                  shell: bash
                  run: |
                    set -euo pipefail
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends jq clang lld xz-utils zip unzip
                    mkdir -p "$RUNNER_TEMP/dsr-test-bin"
                    GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
                    echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
                - name: Validate actual native archive collection and receipts
                  shell: bash
                  run: |
                    set -euo pipefail
                    yq --version
                    bash -n src/act_runner.sh
                    bash -n scripts/tests/test_native_single_archives.sh
                    bash scripts/tests/test_native_single_archives.sh
          DSR_READ_ONLY_WORKFLOW
          git diff --check
          # No source other than the reviewed runner may have been edited.
          test "$(git diff --name-only -- src scripts tests dsr)" = src/act_runner.sh
          test "$(git ls-files --others --exclude-standard)" = scripts/tests/test_native_single_archives.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/act_runner.sh scripts/tests/test_native_single_archives.sh .github/workflows/native-archive-regression.yml
          git commit -m 'fix(native): include pinned companions in strict single-binary archives' \
            -m 'Apply the reviewed GH #29 repair: use the shared archive collector for singleton archive contracts; derive compression from exact primaries; retain raw and diagnostic behavior; normalize Windows executable suffixes.' \
            -m 'Validated on a full Ubuntu checkout with real yq, Git objects, compiler-produced binaries, archive streams and receipt checks via test_native_single_archives.sh. No live remote release, signing or Rust build is claimed. Convert the one-time application workflow into read-only ongoing regression CI. Refs #29.'
          # A concurrent main update is a conflict, never authority to overwrite.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main
          printf 'Applied native archive implementation: %s\n' "$(git rev-parse HEAD)"
