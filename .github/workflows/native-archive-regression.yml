          test "$(wc -c < "$RUNNER_TEMP/native.patch")" -eq 29768
          echo "6bc8c1dd283e9e303a4e4b66ff54216e07a056d4223332e15d492946685507a3  $RUNNER_TEMP/native.patch" | sha256sum --check
