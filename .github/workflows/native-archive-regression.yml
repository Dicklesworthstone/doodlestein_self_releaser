name: Native archive regression tests
on:
  push:
    branches: [main]
    paths:
      - src/act_runner.sh
      - src/artifact_naming.sh
      - src/cargo_cache.sh
      - src/cargo_sources.sh
      - src/config.sh
      - scripts/tests/test_cargo_cache.sh
      - scripts/tests/test_native_single_archives.sh
      - scripts/tests/test_strict_cargo_private_cache.sh
      - .github/workflows/native-archive-regression.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-archive-regression-main
  cancel-in-progress: false
jobs:
  native-archives:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install native archive regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq clang lld xz-utils zip unzip python3 cargo rustc
          else
            for tool in jq xz go; do
              command -v "$tool" >/dev/null || brew install "$tool"
            done
            python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))' 2>/dev/null || brew install python
            command -v cargo >/dev/null || brew install rust
            if (( BASH_VERSINFO[0] < 4 )); then brew install bash; fi
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Validate actual native archive collection and receipts
        shell: bash
        run: |
          set -euo pipefail
          yq --version
          bash -n src/act_runner.sh
          bash -n src/cargo_cache.sh
          bash -n src/cargo_sources.sh
          bash -n scripts/tests/test_cargo_cache.sh
          bash -n scripts/tests/test_native_single_archives.sh
          bash -n scripts/tests/test_strict_cargo_private_cache.sh
          bash scripts/tests/test_cargo_cache.sh
          bash scripts/tests/test_strict_cargo_private_cache.sh
          bash scripts/tests/test_native_single_archives.sh
