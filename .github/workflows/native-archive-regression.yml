# One-time, reviewed patch application for the pending GH #29 repair.
# Only the exact preimage blob is eligible. Tests run before a non-force main
# push. The resulting commit replaces this job with read-only regression CI.
name: Native archive regression tests
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-archive-regression.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Release regression tests]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: native-archive-repair-main
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: >-
      github.repository == 'Dicklesworthstone/doodlestein_self_releaser' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Require exact reviewed runner preimage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/act_runner.sh)" = 2feee5248e2c21fb3c8b51861e1a38166ccfc70f
          test ! -e scripts/tests/test_native_single_archives.sh
          test -z "$(git status --porcelain)"
      - name: Apply digest-pinned native archive implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          # Exact pending native-single-archives.patch, gzip+base64 transported
          # to avoid reconstructing the 478 KB runner. The decoded patch is
          # checked before application; it changes only the two named files.
