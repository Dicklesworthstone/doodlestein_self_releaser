name: Snapshot verification regression tests
on:
  push:
    branches: [main]
    paths:
      - src/act_runner.sh
      - src/xwin_source.sh
      - src/config.sh
      - scripts/tests/test_unix_snapshot_batch.sh
      - scripts/tests/test_native_source_sync.sh
      - .github/workflows/snapshot-regression.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unix-snapshot-regression-main
  cancel-in-progress: false
jobs:
  verify-snapshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install POSIX snapshot verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 git tar mawk grep coreutils dash jq golang-go ripgrep rsync
          else
            command -v python3 >/dev/null || brew install python
            command -v git >/dev/null || brew install git
            for tool in jq go; do
              command -v "$tool" >/dev/null || brew install "$tool"
            done
            command -v rg >/dev/null || brew install ripgrep
            if (( BASH_VERSINFO[0] < 4 )); then brew install bash; fi
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Verify generated snapshot program against real Git and filesystem mutations
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n src/act_runner.sh
          bash -n src/xwin_source.sh
          bash -n scripts/tests/test_unix_snapshot_batch.sh
          bash scripts/tests/test_unix_snapshot_batch.sh
      - name: Verify source sync ownership with the ordinary worker account
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tests/test_native_source_sync.sh
          bash scripts/tests/test_native_source_sync.sh --ownership-only
      # The transport adapter runs a real rsync receiver and tar extractor.
      # A real root process is needed to exercise foreign controller UIDs and
      # mismatched repository ownership, without changing Git's trust policy.
      - name: Verify root and unprivileged receivers with foreign source ownership
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" TMPDIR=/tmp DSR_TEST_REQUIRE_FOREIGN_IDS=1 \
            bash scripts/tests/test_native_source_sync.sh --ownership-only
