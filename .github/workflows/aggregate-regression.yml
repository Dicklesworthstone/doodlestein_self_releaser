name: Aggregate checksum regression tests
on:
  push:
    branches: [main]
    paths:
      - dsr
      - src/act_runner.sh
      - src/config.sh
      - src/signing.sh
      - src/git_ops.sh
      - src/github.sh
      - scripts/tests/test_legacy_checksum_aggregate.sh
      - .github/workflows/aggregate-regression.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-checksum-regression-main
  cancel-in-progress: false
jobs:
  aggregate-checksums:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install real signature and configuration dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends jq minisign build-essential golang-go
          else
            for tool in jq go minisign; do
              command -v "$tool" >/dev/null || brew install "$tool"
            done
            if (( BASH_VERSINFO[0] < 4 )); then brew install bash; fi
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Verify native manifest, resumable receipts, and signed aggregates
        shell: bash
        run: |
          set -euo pipefail
          yq --version
          minisign -v
          bash -n dsr
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_legacy_checksum_aggregate.sh
          bash scripts/tests/test_legacy_checksum_aggregate.sh
