# Bounded preparation of the reviewed GH #28 repair. No branch/ref writes.
name: Aggregate checksum regression tests
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aggregate-regression.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legacy-checksum-repair-main
  cancel-in-progress: false
jobs:
  verify-repair:
    if: github.repository == 'Dicklesworthstone/doodlestein_self_releaser'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install real signature and configuration dependencies
        shell: bash
        run: |
          set -euo pipefail
          for tool in jq go minisign; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
          if (( BASH_VERSINFO[0] < 4 )); then brew install bash; fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/dsr-test-bin"
          GOBIN="$RUNNER_TEMP/dsr-test-bin" go install github.com/mikefarah/yq/v4@v4.47.1
          echo "$RUNNER_TEMP/dsr-test-bin" >> "$GITHUB_PATH"
      - name: Retrieve exact reviewed patch and regression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object src/act_runner.sh)" = 75db6e9a7e8e0b7b3ad07225778efd39dd2a562c
          test "$(git hash-object dsr)" = cf6a26ea90c2c8a386fbc87a62132150521237b2
          test ! -e scripts/tests/test_legacy_checksum_aggregate.sh
          test -z "$(git status --porcelain)"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/8d7216779f4169ba76d558c511c9345c7391e05d" --jq .content | base64 -d > "$RUNNER_TEMP/aggregate.patch"
          echo "75e5c2c9787735f70563b5b7b547cebc543b48631a34a38ff6c97a619d9e63fb  $RUNNER_TEMP/aggregate.patch" | shasum -a 256 --check
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/d9c6a7144ae973d2538e263f5339895e695d13b9" --jq .content | base64 -d > scripts/tests/test_legacy_checksum_aggregate.sh
          test "$(git hash-object scripts/tests/test_legacy_checksum_aggregate.sh)" = d9c6a7144ae973d2538e263f5339895e695d13b9
          git apply --check "$RUNNER_TEMP/aggregate.patch"
      - name: Require the reported failure on the unchanged implementation
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          bash scripts/tests/test_legacy_checksum_aggregate.sh > "$RUNNER_TEMP/aggregate-baseline.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/aggregate-baseline.log"
          test "$rc" -ne 0
          grep -F 'Strict manifest requires one collected additional artifact: checksums.txt' "$RUNNER_TEMP/aggregate-baseline.log"
      - name: Verify repaired native manifest and signed aggregate paths
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/aggregate.patch"
          git diff --check
          bash -n dsr
          bash -n src/act_runner.sh
          bash -n scripts/tests/test_legacy_checksum_aggregate.sh
          bash scripts/tests/test_legacy_checksum_aggregate.sh
      - name: Store verified objects without updating any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = $'dsr\nsrc/act_runner.sh'
          test "$(git ls-files --others --exclude-standard)" = scripts/tests/test_legacy_checksum_aggregate.sh
          source_blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f encoding=utf-8 -F content=@src/act_runner.sh --jq .sha)
          command_blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f encoding=utf-8 -F content=@dsr --jq .sha)
          test "$source_blob" = "$(git hash-object src/act_runner.sh)"
          test "$command_blob" = "$(git hash-object dsr)"
          test_blob=$(git hash-object scripts/tests/test_legacy_checksum_aggregate.sh)
          test "$test_blob" = d9c6a7144ae973d2538e263f5339895e695d13b9
          jq -nc --arg base "$(git rev-parse HEAD^{tree})" --arg source "$source_blob" --arg command "$command_blob" --arg tests "$test_blob" \
            '{base_tree:$base,tree:[{path:"src/act_runner.sh",mode:"100644",type:"blob",sha:$source},{path:"dsr",mode:"100755",type:"blob",sha:$command},{path:"scripts/tests/test_legacy_checksum_aggregate.sh",mode:"100755",type:"blob",sha:$tests}]}' > "$RUNNER_TEMP/aggregate-tree.json"
          tree=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/aggregate-tree.json" --jq .sha)
          printf 'DSR_AGGREGATE_VERIFIED_PARENT %s\n' "$(git rev-parse HEAD)"
          printf 'DSR_AGGREGATE_VERIFIED_SOURCE %s\n' "$source_blob"
          printf 'DSR_AGGREGATE_VERIFIED_COMMAND %s\n' "$command_blob"
          printf 'DSR_AGGREGATE_VERIFIED_TEST %s\n' "$test_blob"
          printf 'DSR_AGGREGATE_VERIFIED_TREE %s\n' "$tree"
